<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Paragraf</title>
  </head>
  <body>
    <!-- tag p digunakan untuk membuat paragraf -->
    <!-- tag br untuk membuat atau menambahkan baris baru dan tag ini bisa ditambahkan dimana saja -->
    <!-- tag hr untuk menambahkan garis horizontal  -->
    <p>ini adalah paragraf 1</p>
    <br />
    <p>ini adalah <br />paragraf 2</p>
    <hr />
    <!-- tag b digunakan untuk membuat teks menjadi bold atau tebal -->
    <!-- tag i digunakan untuk membuat teks menjadi italic atau miring -->
    <!-- tag u digunakan untuk membuat teks menjadi underline atau menandai teks yang tampil dengan garis bawah  -->
    <p><b>Selamat datang</b> di kuliah <i>pemrograman web 1</i></p>
    <p>Nama saya <u>Srilika Fajri Pralambang</u></p>
    <hr />
    <!-- tag strong digunakan untuk penekanan pada teks dan membuat teks menjadi bold
    atau tebal -->
    <!-- tag em digunakan untuk penekanan pada teks dan membuat teks menjadi italic
    atau miring -->
    <p>
      <strong>Pengumuman</strong>. kuliah pemrograman web 1, senin 20 october
      2026 <em>ditiadakan !</em>
    </p>
  </body>
</html>
