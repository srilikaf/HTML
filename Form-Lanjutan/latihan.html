<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form-Lanjutan-Latihan</title>
  </head>
  <body>
    <form action="">
      <table border="0" cellspacing="5" cellpadding="5">
        <tr>
          <td><label for="Text">Text :</label></td>
          <td><input type="text" name="" id="Text" /></td>
        </tr>
        <br />
        <tr>
          <td><label for="Password">Password :</label></td>
          <td><input type="password" name="" id="Password" /></td>
        </tr>
        <br />
        <tr>
          <td>
            <label for="Radio 1">Radio 1</label
            ><input type="radio" name="JenisRadio" id="Radio 1" />
          </td>
          <td>
            <label for="Radio 2">Radio 2</label
            ><input type="radio" name="JenisRadio" id="Radio 2" />
          </td>
        </tr>
        <tr>
          <td>
            <label for="checkbox 1">Checkbox 1</label
            ><input type="checkbox" name="" id="checkbox 1" />
          </td>
          <td>
            <label for="checkbox 2">Checkbox 2</label
            ><input type="checkbox" name="" id="checkbox 2" />
          </td>
        </tr>
        <tr>
          <td><label for="ComboBox">Combo Box</label></td>
          <td>
            <select>
              <option value="">Option 1</option>
              <option value="">Option 2</option>
              <option value="">Option 3</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="">Textarea</label></td>
          <td><textarea name="" id=""></textarea></td>
        </tr>
        <tr>
          <td></td>
          <td><button type="submit">Button</button></td>
        </tr>
      </table>
    </form>
  </body>
</html>
