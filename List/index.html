<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML List</title>
  </head>
  <body>
    <!-- tag h3 ini adalah heading  -->
    <!-- tag ol adalah list terurut dan ol mempunyai type= 1, A, a, I, i -->
    <h3>To Do List</h3>
    <ol type="I">
      <li>Bangun Pagi</li>
      <li>Sarapan</li>
      <li>Tidur Lagi</li>
    </ol>
    <hr />
    <!-- tag h3 ini adalah heading  -->
    <!-- tag ul adalah unordered list dan tag ul ini mempunyai type = disc, square,
    circle -->
    <h3>Saat sarapan, saya akan makan</h3>
    <ul type="circle">
      <li>Nasi Goreng</li>
      <li>Mie Ayam</li>
      <li>Nasi Uduk</li>
    </ul>
    <hr />
    <!-- tag h3 ini adalah heading  -->
    <!-- tag dl adalah definition list digunakan untuk membuat terminalogi dan
    deskripsi -->
    <h3>Pemrograman web 1</h3>
    <dl>
      <dt><strong>HTML</strong></dt>
      <dd>Hypertext Markup Languange</dd>
      <dt><strong>CSS</strong></dt>
      <dd>Cascading Style Sheet</dd>
    </dl>
  </body>
</html>
