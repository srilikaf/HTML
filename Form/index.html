<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Form</title>
  </head>
  <body>
    <!-- elemen" yang ada didalam tag form yaitu input, textarea, select,
    button, dan label -->

    <!-- type input ada text, password, radio, checkbox, submit, reset, button, dll -->

    <label for="username">username :</label>
    <input type="text" id="username" />
    <br /><br />
    <label for="password">password :</label>
    <input type="password" id="password" />
    <br /><br />
    <input type="radio" id="pria" name="JenisKelamin" />
    <label for="pria">pria</label>
    <input type="radio" id="wanita" name="JenisKelamin" />
    <label for="wanita">wanita</label>
    <br /><br />
    <input type="checkbox" id="menyanyi" /><label for="menyanyi"
      >menyanyi</label
    >
    <input type="checkbox" id="olahraga" /><label for="olahraga"
      >olahraga</label
    >
    <input type="checkbox" id="ngoding" /><label for="ngoding">ngoding</label>
    <br /><br />
    <button type="submit">kirim</button>
    <!-- button memiliki type submit, reset,dan button -->
  </body>
</html>
